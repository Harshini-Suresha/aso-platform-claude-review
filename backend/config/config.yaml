version: 1

data:
  csv_path: "OligoFormer/data/Hu.csv"
  train_split: 0.8
  seed: 42

model:
  type: "BaselineMLP"
  input_dim: 1291  # 2 × 640 RNA-FM (siRNA + mRNA) + 11 accessibility
  hidden_dim: 128
  output_dim: 1

rnafm:
  model_name: "rna_fm_t12"
  model_path: "backend/pretrained/RNA-FM_pretrained.pth"
  embedding_dim: 640
  pooling: "mean"
  layer: 12

train:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  optimizer: "adam"
  loss_function: "mse"
  seed: 42
  val_log_interval: 10

paths:
  checkpoint_dir: "backend/checkpoints"
  log_dir: "backend/logs"
  checkpoint_name: "rnafm_accessibility"
